name: Documentation

on:
  # 1. During Pull Request: Test build and upload downloadable HTML preview
  pull_request:
    branches: [ master ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/deploy-docs.yml'

  # 2. Deploy ONLY when a release tag is pushed (e.g. v0.1.0) or release is published
  push:
    tags:
      - 'v*'
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  docs:
    name: Build & Deploy Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      # Step A: Build static site
      - name: Build Documentation Site
        run: mkdocs build --strict

      # Step B: On Pull Request - Upload the rendered HTML as a downloadable artifact for review
      - name: Upload PR Preview Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-preview
          path: site/
          retention-days: 7

      # Step C: ONLY on Release - Deploy live to GitHub Pages
      - name: Deploy to GitHub Pages
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: mkdocs gh-deploy --force
